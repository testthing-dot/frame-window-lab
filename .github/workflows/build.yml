
name: Build Frame Window Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Window-Lab-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
